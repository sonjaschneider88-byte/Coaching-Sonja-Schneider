name: Apply logo size fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix header logo CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('css/styles.css')
          s = p.read_text(encoding='utf-8')
          old = '''..site-logo {\n  display: block;\n  width: 70px !important;\n  height: auto;\n  flex-shrink: 0;\n}\n\n.wordmark {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n}\n\n.wordmark__text {\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n}'''
          new = '''/* Header logo: small, stable size on desktop and mobile */\n.site-header .site-logo {\n  display: block;\n  width: 50px;\n  height: auto;\n  flex: 0 0 50px;\n}\n\n.site-header .wordmark {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n}\n\n.site-header .wordmark__text {\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n}\n\n@media (max-width: 820px) {\n  .site-header .site-logo {\n    width: 44px;\n    flex-basis: 44px;\n  }\n}'''
          if old not in s:
              raise SystemExit('Expected old logo block was not found; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/styles.css
          git commit -m "Fix header logo size" || exit 0
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/logo-fix.yml
          git add .github/workflows/logo-fix.yml
          git commit -m "Remove temporary logo fix workflow" || exit 0
          git push
